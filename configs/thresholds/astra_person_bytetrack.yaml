# Astra stage-one person detection and stable ID assignment.
model_path: ~/.cache/models/vision/yolov8/yolov8n_no_dfl.q.onnx
test_video: ~/.cache/assets/video/003_palace.mp4
image_size: [640, 640]
label_file_path: assets/labels/coco.txt
class: deploy.bytetrack.ByteTrackTracker
default_params:
  conf_threshold: 0.40
  iou_threshold: 0.45
  track_buffer: 30
  frame_rate: 30
  # K1 camera tracking uses two accelerator workers.
  # The conditional hard-hat session uses one CPU worker to avoid TCM contention.
  num_threads: 2
  providers:
    - SpaceMITExecutionProvider
