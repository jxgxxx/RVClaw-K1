schema_version: 2
vision_api_url: http://127.0.0.1:8017
result_root: /data/RVClaw/runs/route-inspections
restore_camera_mode: true
speech_ack_timeout_s: 22.0
defaults:
  enabled: true
  task_id: inspect_meter
  kind: digital_meter
  search_offsets_deg:
  - 0
  - -5
  - 5
  reads_per_heading: 3
  min_consistent_reads: 2
  min_confidence: 0.65
  numeric_tolerance: 0.01
  timeout_s: 60.0
  failure_policy: continue
points:
  A:
    meter_id: OFFICE-A
    display_name: 仪表 01
    kind: digital_meter
    inspection_yaw_deg: 0.0
  B:
    meter_id: OFFICE-B
    display_name: 仪表 02
    kind: digital_meter
    inspection_yaw_deg: -90.0
  C:
    meter_id: OFFICE-C
    display_name: 仪表 03
    kind: pointer_meter
    inspection_yaw_deg: 90.0
    calibration:
      zero_angle_deg: 270
      sweep_deg: 360
      min_value: 0
      max_value: 100
      direction: clockwise
      decimal_places: 2
