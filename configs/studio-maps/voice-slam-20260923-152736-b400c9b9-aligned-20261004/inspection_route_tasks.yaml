schema_version: 2
vision_api_url: http://127.0.0.1:8017
result_root: /data/RVClaw/runs/route-inspections
restore_camera_mode: true
speech_ack_timeout_s: 22.0

defaults:
  enabled: true
  task_id: inspect_meter
  kind: digital_meter
  search_offsets_deg: [0, -5, 5]
  reads_per_heading: 3
  min_consistent_reads: 2
  min_confidence: 0.65
  numeric_tolerance: 0.01
  timeout_s: 60.0
  failure_policy: continue

# A/B/C are fixed observation poses. The meter targets are 0.20 m ahead of
# the new +X, +Y, -X observation headings respectively.
points:
  A:
    meter_id: PHONE-A
    kind: digital_meter
    min_consistent_reads: 1
    raw_text_pattern: '^[0-9]{2}\.[0-9]{2}$'
    normal_max: 50
    normal_max_inclusive: true
    target: {x_m: 3.355962, y_m: -0.199759}
  B:
    meter_id: PHONE-B
    kind: digital_meter
    min_consistent_reads: 2
    reads_per_heading: 4
    raw_text_pattern: '^[0-9]{5}$'
    normal_max: 99999
    normal_max_inclusive: false
    target: {x_m: 6.511683, y_m: 2.956445}
  C:
    meter_id: PHONE-C
    kind: pointer_meter
    calibration:
      zero_angle_deg: 270
      sweep_deg: 360
      min_value: 0
      max_value: 100
      direction: clockwise
      decimal_places: 2
    normal_min: 60
    normal_min_inclusive: true
    numeric_tolerance: 2.0
    reads_per_heading: 4
    target: {x_m: 1.222192, y_m: 2.444866}
