schema_version: 2
vision_api_url: http://127.0.0.1:8017
result_root: /data/RVClaw/runs/route-inspections
restore_camera_mode: true
speech_ack_timeout_s: 22.0

defaults:
  enabled: true
  task_id: inspect_meter
  kind: digital_meter
  search_offsets_deg: [0, -5, 5]
  reads_per_heading: 3
  min_consistent_reads: 2
  min_confidence: 0.65
  numeric_tolerance: 0.01
  timeout_s: 60.0
  failure_policy: continue

# Navigation stops at the separate free-space waypoints in waypoints.yaml.
# Observation headings are independent of small stopped-pose corrections.
points:
  A:
    meter_id: PRINT-A
    kind: digital_meter
    min_consistent_reads: 2
    # Keep two independent matching reads when body registration rejects a frame.
    reads_per_heading: 4
    # A rejected camera view must not reuse a potentially displaced AMCL pose.
    # Verify fresh stationary geometry before one bounded position correction.
    stopped_position_tolerance_m: 0.12
    verify_position_before_correction: true
    timeout_s: 90.0
    raw_text_pattern: '^[0-9]{2}\.[0-9]{2}$'
    normal_max: 50
    normal_max_inclusive: true
    inspection_yaw_deg: 91.5
  B:
    meter_id: PRINT-B
    kind: digital_meter
    min_consistent_reads: 2
    reads_per_heading: 4
    # Reuse the existing stopped pose; reapproach once only when XY is off.
    stopped_position_tolerance_m: 0.12
    timeout_s: 90.0
    # Fixed observation heading prevents bearing chasing during AMCL updates.
    inspection_yaw_deg: -89.25
    raw_text_pattern: '^[0-9]{5}$'
    normal_max: 99999
    normal_max_inclusive: false
  C:
    meter_id: PRINT-C
    kind: pointer_meter
    calibration:
      zero_angle_deg: 270
      sweep_deg: 360
      min_value: 0
      max_value: 100
      direction: clockwise
      decimal_places: 2
    normal_min: 60
    normal_min_inclusive: true
    numeric_tolerance: 2.0
    reads_per_heading: 4
    # Keep the surveyed, centred observation direction fixed during inspection.
    search_offsets_deg: [0, -20, 20]
    inspection_yaw_deg: 92.5
