[Service]
# Wait for actual USB enumeration; no fixed 20 second delay on warm starts.
ExecStartPre=
ExecStartPre=@ROBOT_ROOT@/deploy/k1/with_device_groups.sh /usr/bin/python3 @ROBOT_ROOT@/deploy/k1/wait_for_devices.py navigation
Environment=PYTHONPYCACHEPREFIX=@ROBOT_ROOT@/runtime/k1/mission/cache/python
