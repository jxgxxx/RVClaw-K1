[Service]
# Stay asleep when USB is absent, instead of reloading ASR every two seconds.
ExecStartPre=
ExecStartPre=@ROBOT_ROOT@/deploy/k1/with_device_groups.sh /usr/bin/python3 @ROBOT_ROOT@/deploy/k1/wait_for_devices.py voice
ExecStartPre=@ROBOT_ROOT@/deploy/k1/with_device_groups.sh /usr/bin/amixer -q -c Device -- sset PCM -10dB unmute
ExecStartPre=/usr/bin/python3 @ROBOT_ROOT@/deploy/k1/recover_voice_module.py
TimeoutStartSec=infinity
EnvironmentFile=@ROBOT_ROOT@/runtime/k1/environment/rvclaw-runtime-demand.env
